<div class="login-container">
  <div class="form-header">
    <h1><span class="header-icon">P</span><strong>ParkSmart</strong></h1>
    <p>Parking Management System</p>
  </div>

  <h2>Operator Login</h2> <!-- Ou gardez "Login" si vous préférez -->

  <form>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>

    <div class="form-group">
      <label for="role">Login as</label>
      <select id="role" name="role">
        <option value="" disabled selected>Select your role</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
        <option value="guest">Guest</option>
        <!-- Ajoutez d'autres rôles si nécessaire -->
      </select>
    </div>

    <div class="form-group remember-me">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Remember me</label>
    </div>

    <button type="submit" class="login-button">Login</button>
  </form>

  <hr>

  <footer>
    <p>&copy; 2025 Parking Management System. All rights reserved.</p>
  </footer>
</div>
